# Albireus iOS -> TestFlight, run from chentu030/forfun; source checked out from stt_tool with ALBIREUS_GH_TOKEN.
# iOS app → TestFlight (manual only; nothing runs or bills until someone presses "Run workflow").
#
# Secrets (Settings → Secrets and variables → Actions) — docs/apple-release.md §GitHub Actions:
#   APPLE_TEAM_ID                     10-character Apple Developer team id
#   ASC_KEY_ID                        App Store Connect API key id
#   ASC_ISSUER_ID                     App Store Connect API issuer id
#   ASC_KEY_P8                        base64 of AuthKey_<id>.p8 (role: App Manager or Admin)
#   GOOGLE_SERVICE_INFO_PLIST_B64     base64 of the Firebase iOS app's GoogleService-Info.plist
#
# Signing is Xcode "automatic" with the API key (cloud-managed certificate + profile), so no
# .p12 / provisioning profile has to be stored. The baseline app shell is the published, signed
# one (mobile/scripts/fetch-shell.mjs) — the frontend is not built here.
name: Albireus iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (leave empty = 1000 + run number)"
        required: false
        default: ""
      ref:
        description: "stt_tool branch/commit to build"
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: albireus-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
    steps:
      # Expressions can't do arithmetic, so the default build number (100 + run number) is set here.
      - name: Build number
        run: echo "BUILD_NUMBER=${BUILD_NUMBER_INPUT:-$((1000 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: chentu030/stt_tool
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ALBIREUS_GH_TOKEN }}
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 GSI IOS_DIST_P12 IOS_DIST_P12_PASSWORD; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::missing secrets:$missing (docs/apple-release.md)"; exit 1; fi

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Shell routing parity (Android Java vs shared fixture)
        working-directory: mobile
        run: node --test scripts/shell-parity.test.mjs

      - name: Baseline app shell (published, signature-checked)
        working-directory: mobile
        run: |
          node scripts/fetch-shell.mjs
          SHELL_SRC=.shell-download node scripts/sync-shell.mjs

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync ios

      - name: Configure (Firebase plist, URL scheme, team id)
        working-directory: mobile
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ios-configure.sh

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Manual signing for the App target only: a fixed "Apple Distribution" certificate (secret
      # IOS_DIST_P12, made once on Windows — docs/apple-release.md §4) + an App Store profile
      # fetched with the API key (mobile/scripts/ios-ci-signing.py explains why not automatic).
      - name: Signing certificate + App Store profile
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"; KCP="$(uuidgen)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          python3 mobile/scripts/ios-ci-signing.py
          command -v fastlane >/dev/null || sudo gem install fastlane -N
          fastlane run get_provisioning_profile api_key_path:"$RUNNER_TEMP/asc/api.json" \
            app_identifier:com.albireus.app team_id:"$APPLE_TEAM_ID" \
            provisioning_name:"Albireus AppStore CI" ignore_profiles_with_different_name:true \
            output_path:"$RUNNER_TEMP" filename:appstore.mobileprovision

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*Albireus|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { tail -200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export + upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist mobile/ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER — it appears in App Store Connect → TestFlight after processing (~10–30 min)."

      - name: Archive log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" mobile/ios/App/App/GoogleService-Info.plist
