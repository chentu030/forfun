name: Fetch classics from Wikisource

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_wikisource.py
      - .github/workflows/fetch-classics.yml

permissions:
  contents: write

concurrency:
  group: fetch-classics-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/fetch_wikisource.py

      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: books/

      - name: Commit books back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/
          git diff --cached --quiet || git commit -m "Add classics fetched from Wikisource"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
