name: stockdb-backfill

# 台股資料歷史回補（StockDB）。每個 job 一個獨立 IP、直連官方 API（5 秒 3 次限速），
# 依年份平行跑，結果用 artifact 下載回本機 StockDB。日常更新仍由本機 daily_run 負責。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只跑某個 job 名稱（空白＝全部），例如 foreign-2021"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { name: market_total, year: "2019h2", start: "20191201", end: "20191231" }
          - { name: market_total, year: "2020h1", start: "20200101", end: "20200630" }
          - { name: market_total, year: "2020h2", start: "20200701", end: "20201231" }
          - { name: market_total, year: "2021h1", start: "20210101", end: "20210630" }
          - { name: market_total, year: "2021h2", start: "20210701", end: "20211231" }
          - { name: market_total, year: "2022h1", start: "20220101", end: "20220630" }
          - { name: market_total, year: "2022h2", start: "20220701", end: "20221231" }
          - { name: market_total, year: "2023h1", start: "20230101", end: "20230630" }
          - { name: market_total, year: "2023h2", start: "20230701", end: "20231231" }
          - { name: market_total, year: "2024h1", start: "20240101", end: "20240630" }
          - { name: market_total, year: "2024h2", start: "20240701", end: "20241231" }
          - { name: market_total, year: "2025h1", start: "20250101", end: "20250630" }
          - { name: market_total, year: "2025h2", start: "20250701", end: "20251231" }
          - { name: market_total, year: "2026h1", start: "20260101", end: "20260630" }
          - { name: market_total, year: "2026h2", start: "20260701", end: "20261022" }
          - { name: foreign, year: "2020h1", start: "20200101", end: "20200630" }
          - { name: foreign, year: "2020h2", start: "20200701", end: "20201231" }
          - { name: foreign, year: "2021h1", start: "20210101", end: "20210630" }
          - { name: foreign, year: "2021h2", start: "20210701", end: "20211231" }
          - { name: foreign, year: "2022h1", start: "20220101", end: "20220630" }
          - { name: foreign, year: "2022h2", start: "20220701", end: "20221231" }
          - { name: foreign, year: "2023h1", start: "20230101", end: "20230630" }
          - { name: foreign, year: "2023h2", start: "20230701", end: "20231231" }
          - { name: foreign, year: "2024h1", start: "20240101", end: "20240630" }
          - { name: foreign, year: "2024h2", start: "20240701", end: "20241231" }
          - { name: foreign, year: "2025h1", start: "20250101", end: "20250630" }
          - { name: foreign, year: "2025h2", start: "20250701", end: "20251231" }
    env:
      STOCKDB_ROOT: ${{ github.workspace }}/out
      PYTHONUTF8: "1"
      TZ: Asia/Taipei
    steps:
      - id: chk
        name: 要不要跑這個 job
        run: |
          want="${{ github.event.inputs.only }}"
          me="${{ matrix.name }}-${{ matrix.year }}"
          if [ -z "$want" ] || [ "$want" = "$me" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "略過 $me"; fi
      - if: steps.chk.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: stockdb_backfill
      - if: steps.chk.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.chk.outputs.run == 'true'
        run: pip install requests
      - name: 回補
        if: steps.chk.outputs.run == 'true'
        run: |
          mkdir -p out
          cp stockdb_backfill/台股交易日.csv out/
          if [ "${{ matrix.name }}" = "market_total" ]; then
            script=stockdb_backfill/三大法人市場合計/official_market_total_crawler.py
          else
            script=stockdb_backfill/外資持股/foreign_holding_crawler.py
          fi
          python -u "$script" ${{ matrix.start }} ${{ matrix.end }} --direct || echo "exit=$?（有失敗的日期，本機會再補）"
          rm -f out/台股交易日.csv
          find out -name '*.csv' | wc -l
      - if: steps.chk.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.year }}
          path: out/
          retention-days: 7
