name: stockdb-backfill

# 台股資料歷史回補（StockDB）。每個 job 一個獨立 IP、直連官方 API（5 秒 3 次限速），
# 依年份平行跑，結果用 artifact 下載回本機 StockDB。日常更新仍由本機 daily_run 負責。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只跑某個 job 名稱（空白＝全部），例如 foreign-2021"
        required: false
        default: ""

jobs:
  backfill:
    if: ${{ github.event.inputs.only == '' || github.event.inputs.only == format('{0}-{1}', matrix.name, matrix.year) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { name: market_total, year: 2019, start: "20191201", end: "20191231" }
          - { name: market_total, year: 2020, start: "20200101", end: "20201231" }
          - { name: market_total, year: 2021, start: "20210101", end: "20211231" }
          - { name: market_total, year: 2022, start: "20220101", end: "20221231" }
          - { name: market_total, year: 2023, start: "20230101", end: "20231231" }
          - { name: market_total, year: 2024, start: "20240101", end: "20241231" }
          - { name: market_total, year: 2025, start: "20250101", end: "20251231" }
          - { name: market_total, year: 2026, start: "20260101", end: "20261022" }
          - { name: foreign, year: 2020, start: "20200101", end: "20201231" }
          - { name: foreign, year: 2021, start: "20210101", end: "20211231" }
          - { name: foreign, year: 2022, start: "20220101", end: "20221231" }
          - { name: foreign, year: 2023, start: "20230101", end: "20231231" }
          - { name: foreign, year: 2024, start: "20240101", end: "20241231" }
          - { name: foreign, year: 2025, start: "20250101", end: "20251231" }
          - { name: foreign, year: 2026, start: "20260101", end: "20261022" }
    env:
      STOCKDB_ROOT: ${{ github.workspace }}/out
      PYTHONUTF8: "1"
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: stockdb_backfill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 回補
        run: |
          mkdir -p out
          cp stockdb_backfill/台股交易日.csv out/
          if [ "${{ matrix.name }}" = "market_total" ]; then
            script=stockdb_backfill/三大法人市場合計/official_market_total_crawler.py
          else
            script=stockdb_backfill/外資持股/foreign_holding_crawler.py
          fi
          python -u "$script" ${{ matrix.start }} ${{ matrix.end }} --direct || echo "exit=$?（有失敗的日期，本機會再補）"
          rm -f out/台股交易日.csv
          find out -name '*.csv' | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.year }}
          path: out/
          retention-days: 7
